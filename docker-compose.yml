services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 - Primary data store (shared by app + Windmill)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: wfa-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workflow_automation}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      WINDMILL_DB: ${WINDMILL_DB:-windmill}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init/000_create_windmill_db.sh:/docker-entrypoint-initdb.d/000_create_windmill_db.sh:ro
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ./database/migrations/002_add_offer_indexes.sql:/docker-entrypoint-initdb.d/002_add_offer_indexes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-workflow_automation}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Windmill Server - Workflow engine UI & API (port 8000)
  # ---------------------------------------------------------------------------
  windmill_server:
    image: ghcr.io/windmill-labs/windmill:main
    container_name: wfa-windmill-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${WINDMILL_DB:-windmill}?sslmode=disable
      MODE: server
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Windmill Worker - Executes scripts and flows
  # ---------------------------------------------------------------------------
  windmill_worker:
    image: ghcr.io/windmill-labs/windmill:main
    container_name: wfa-windmill-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${WINDMILL_DB:-windmill}?sslmode=disable
      MODE: worker
      WORKER_GROUP: default
      RUST_LOG: info
    depends_on:
      - windmill_server
    volumes:
      - worker_dependency_cache:/tmp/windmill/cache

  # ---------------------------------------------------------------------------
  # NOTE: Backend and Frontend are excluded from Docker Compose.
  # - Run the backend from Visual Studio (ASP.NET 8.0)
  # - Run the frontend from VS Code (Angular 17 via `ng serve`)
  # ---------------------------------------------------------------------------

volumes:
  pgdata:
    driver: local
  worker_dependency_cache:
    driver: local
